<!DOCTYPE html>
<html>
<head>
  <title>Bikes</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-4">

<h2>Bike Management</h2>

<table class="table table-bordered mt-3">
  <thead>
    <tr>
      <th>Name</th>
      <th>Price</th>
      <th>Action</th>
    </tr>
  </thead>

  <tbody id="bikeTable"></tbody>
</table>

</div>

<script>
const API = "http://localhost:5000/api";

async function loadBikes() {
  const res = await fetch(`${API}/bikes`);
  const data = await res.json();

  let html = "";

  data.forEach(bike => {
    html += `
      <tr>
        <td>${bike.name}</td>
        <td>${bike.price}</td>
        <td>
          <button class="btn btn-danger btn-sm" onclick="deleteBike('${bike._id}')">Delete</button>
        </td>
      </tr>
    `;
  });

  document.getElementById("bikeTable").innerHTML = html;
}

async function deleteBike(id) {
  await fetch(`${API}/bikes/${id}`, { method: "DELETE" });
  loadBikes();
}

loadBikes();
</script>

</body>
</html>
