<!DOCTYPE html>
<html>
<head>
  <title>E-Bikes Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark px-3">
  <a class="navbar-brand" href="#">E-Bikes Admin</a>
</nav>

<div class="container mt-4">

  <div class="row">

    <div class="col-md-4">
      <div class="card text-bg-primary mb-3">
        <div class="card-body">
          <h5>Total Bikes</h5>
          <h2 id="bikeCount">0</h2>
        </div>
      </div>
    </div>

    <div class="col-md-4">
      <div class="card text-bg-success mb-3">
        <div class="card-body">
          <h5>Total Users</h5>
          <h2 id="userCount">0</h2>
        </div>
      </div>
    </div>

  </div>

</div>

<script src="js/api.js"></script>
</body>
</html>
