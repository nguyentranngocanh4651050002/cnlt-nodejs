<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tin Tức Công Nghệ Xe Máy - EBikes</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body style="padding: 40px;">
    <div style="max-width: 1000px; margin: 0 auto;">
        <h2 style="color: var(--text-main); margin-bottom: 30px;">SYSTEM_LOGS / TIN TỨC & KHUYẾN MÃI</h2>
        
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px;">
            <!-- Bài viết 1 -->
            <div style="background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius); overflow: hidden;">
                <img src="https://images.unsplash.com/photo-1485965120184-e220f721d03e?w=500" style="width: 100%; height: 180px; object-fit: cover;" alt="News Image">
                <div style="padding: 20px;">
                    <span style="color: var(--primary-lime); font-size: 11px; font-weight: bold; text-transform: uppercase;">Cập Nhật Hệ Thống</span>
                    <h3 style="color: var(--text-main); margin: 10px 0; font-size: 16px;">Ra Mắt Chuỗi 50 Trạm Đổi Pin Siêu Tốc Thế Hệ Mới</h3>
                    <p style="color: var(--text-muted); font-size: 13px; line-height: 1.5;">Rút ngắn thời gian nạp năng lượng chỉ còn dưới 1 phút với trạm đổi pin robot tự động.</p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
