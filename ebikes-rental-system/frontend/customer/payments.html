<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thanh Toán Hợp Đồng - EBikes</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body style="padding: 40px;">
    <div style="max-width: 600px; margin: 0 auto; background: var(--bg-card); padding: 30px; border-radius: var(--radius); border: 1px solid var(--border-color);">
        <h2 style="color: var(--text-main); border-bottom: 2px solid var(--primary-lime); padding-bottom: 10px; margin-bottom: 25px;">SECURE_CHECKOUT / THANH TOÁN</h2>
        
        <div style="margin-bottom: 20px; line-height: 2;">
            <div style="display: flex; justify-content: space-between;"><span style="color: var(--text-muted);">Mẫu xe đặt:</span><strong style="color: var(--text-main);">Tesla Bike Cyber X</strong></div>
            <div style="display: flex; justify-content: space-between;"><span style="color: var(--text-muted);">Thời gian thuê:</span><strong style="color: var(--text-main);">3 Ngày</strong></div>
            <div style="display: flex; justify-content: space-between;"><span style="color: var(--text-muted);">Đơn giá ngày:</span><strong style="color: var(--text-main);">150.000 VND</strong></div>
            <hr style="border: 0; border-top: 1px solid var(--border-color); margin: 15px 0;">
            <div style="display: flex; justify-content: space-between;"><span style="color: var(--text-main); font-weight: bold;">TỔNG TIỀN PHẢI TRẢ:</span><strong style="color: var(--primary-cyan); font-size: 20px;">450.000 VND</strong></div>
        </div>

        <div style="background: var(--bg-main); padding: 15px; border-radius: var(--radius); text-align: center; margin-bottom: 25px;">
            <p style="color: var(--text-light); font-size: 13px; font-weight: 600;">HỆ THỐNG CẤP MÃ QR CHUYỂN KHOẢN TỰ ĐỘNG VIA VIETQR</p>
            <div style="background: white; width: 180px; height: 180px; margin: 15px auto; display: flex; align-items: center; justify-content: center; border: 1px solid var(--border-color);">
                <span style="color: #64748b; font-size: 12px;">[ QR CODE PLACEHOLDER ]</span>
            </div>
        </div>

        <button onclick="alert('Thanh toán thành công! Đang kích hoạt đơn thuê...')" style="width: 100%; background: var(--primary-lime); color: white; border: none; padding: 14px; font-weight: 700; border-radius: var(--radius); cursor: pointer;">XÁC NHẬN ĐÃ CHUYỂN KHOẢN</button>
    </div>
</body>
</html>
