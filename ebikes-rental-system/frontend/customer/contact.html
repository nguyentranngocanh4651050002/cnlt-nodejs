<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liên Hệ Hỗ Trợ - EBikes</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body style="padding: 40px;">
    <div style="max-width: 800px; margin: 0 auto; background: var(--bg-card); padding: 40px; border-radius: var(--radius); border: 1px solid var(--border-color); display: flex; gap: 40px;">
        <div style="flex: 1;">
            <h2 style="color: var(--text-main); margin-bottom: 15px;">SUPPORT_LINE</h2>
            <p style="color: var(--text-muted); font-size: 14px; line-height: 1.6; margin-bottom: 25px;">Mọi vấn đề về vận hành xe, lỗi GPS hoặc yêu cầu cứu hộ khẩn cấp xin vui lòng kết nối với tổng đài điều phối.</p>
            <div style="color: var(--text-light); font-size: 14px; line-height: 2;">
                📞 <strong>Hotline:</strong> 1900 xxxx (24/7)<br>
                ✉️ <strong>Email:</strong> support@ebikes.com<br>
                🏢 <strong>Trụ sở:</strong> Khu Công Nghệ Cao, TP. HCM
            </div>
        </div>
        <div style="flex: 1; border-left: 1px solid var(--border-color); padding-left: 30px;">
            <h4 style="color: var(--text-main); margin-bottom: 15px;">GỬI TIN NHẮN TRỰC TUYẾN</h4>
            <form style="display: flex; flex-direction: column; gap: 15px;">
                <input type="text" placeholder="Tiêu đề cần hỗ trợ..." style="width: 100%; padding: 10px; background: var(--bg-main); border: 1px solid var(--border-color); color: var(--text-main); border-radius: var(--radius); outline: none;">
                <textarea placeholder="Mô tả chi tiết sự cố hoặc thắc mắc của bạn..." style="width: 100%; height: 100px; padding: 10px; background: var(--bg-main); border: 1px solid var(--border-color); color: var(--text-main); border-radius: var(--radius); outline: none; resize: none;"></textarea>
                <button type="button" onclick="alert('Đã gửi tin nhắn đến trung tâm cứu hộ!')" style="background: var(--primary-lime); color: white; border: none; padding: 12px; font-weight: 700; border-radius: var(--radius); cursor: pointer;">GỬI YÊU CẦU</button>
            </form>
        </div>
    </div>
</body>
</html>
