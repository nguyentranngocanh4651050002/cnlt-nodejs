<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi Tiết Xe - EBikes</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body style="padding: 40px;">
    <div style="max-width: 1000px; margin: 0 auto; background: var(--bg-card); padding: 30px; border-radius: var(--radius); border: 1px solid var(--border-color); display: flex; gap: 40px;">
        <div style="flex: 1;">
            <img src="https://images.unsplash.com/photo-1558981806-ec527fa84c39?w=500" style="width: 100%; border-radius: var(--radius); object-fit: cover;" alt="Bike Image">
        </div>
        <div style="flex: 1; display: flex; flex-direction: column; justify-content: space-between;">
            <div>
                <h1 style="color: var(--text-main); margin-bottom: 15px;">Tesla Bike Cyber X</h1>
                <p style="color: var(--primary-cyan); font-size: 24px; font-weight: 800; margin-bottom: 20px;">150.000 VND / Ngày</p>
                
                <h3 style="color: var(--text-light); margin-bottom: 10px;">THÔNG SỐ KỸ THUẬT:</h3>
                <ul style="color: var(--text-muted); padding-left: 20px; line-height: 1.8; margin-bottom: 25px;">
                    <li>Vận tốc tối đa: 90 km/h</li>
                    <li>Động cơ: Hub Motor 4000W</li>
                    <li>Trọng tải tối đa: 180 kg</li>
                    <li>Công nghệ: Phanh ABS thông minh, Smartkey</li>
                </ul>
            </div>

            <div style="border-top: 1px solid var(--border-color); padding-top: 20px;">
                <button onclick="location.href='payment.html'" style="width: 100%; background: var(--primary-lime); color: white; border: none; padding: 15px; font-weight: 700; font-size: 16px; border-radius: var(--radius); cursor: pointer;">TIẾN HÀNH THUÊ XE NGAY</button>
                <button onclick="location.href='review.html'" style="width: 100%; background: transparent; color: var(--text-muted); border: 1px solid var(--border-color); padding: 10px; font-weight: 600; margin-top: 10px; border-radius: var(--radius); cursor: pointer;">XEM ĐÁNH GIÁ TỪ KHÁCH HÀNG</button>
            </div>
        </div>
    </div>
</body>
</html>
