<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đánh Giá Xe - EBikes</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body style="padding: 40px;">
    <div style="max-width: 700px; margin: 0 auto;">
        <h2 style="color: var(--text-main); margin-bottom: 25px;">CUSTOMER_REVIEWS / ĐÁNH GIÁ SẢN PHẨM</h2>
        
        <!-- Form Gửi Đánh Giá -->
        <div style="background: var(--bg-card); padding: 25px; border-radius: var(--radius); border: 1px solid var(--border-color); margin-bottom: 30px;">
            <h4 style="color: var(--text-light); margin-bottom: 15px;">GỬI PHẢN HỒI CỦA BẠN</h4>
            <div style="margin-bottom: 15px;">
                <span style="color: var(--text-muted); font-size: 14px;">Xếp hạng sao: </span>
                <select style="padding: 6px; background: var(--bg-main); border: 1px solid var(--border-color); color: var(--text-main); border-radius: 4px;">
                    <option value="5">⭐⭐⭐⭐⭐ (Xuất Sắc)</option>
                    <option value="4">⭐⭐⭐⭐ (Tốt)</option>
                    <option value="3">⭐⭐⭐ (Bình Thường)</option>
                </select>
            </div>
            <textarea placeholder="Nhập cảm nhận thực tế của bạn về chất lượng xe và dịch vụ pin..." style="width: 100%; height: 100px; padding: 12px; background: var(--bg-main); border: 1px solid var(--border-color); color: var(--text-main); border-radius: var(--radius); outline: none; margin-bottom: 15px; resize: none;"></textarea>
            <button style="background: var(--primary-lime); color: white; border: none; padding: 10px 20px; font-weight: 700; border-radius: var(--radius); cursor: pointer;">GỬI ĐÁNH GIÁ</button>
        </div>
    </div>
</body>
</html>
