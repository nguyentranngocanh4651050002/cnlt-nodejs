<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Cộng đồng thuê Xe Máy 24/7 - Chat Support</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="login-screen">
        <div class="login-card">
            <h1 style="color: #ff9800;">🏍️MOTO GO </h1>
            <input type="text" id="username" placeholder="Nhập tên của bạn...">
            <button onclick="joinSystem()">Vào Hệ Thống</button>
        </div>
    </div>

    <div id="main-app" style="display: none;">
        <div class="sidebar">
            <div class="sidebar-header">ĐANG ONLINE</div>
            <ul id="user-list"></ul>
        </div>
        <div class="chat-container">
            <div class="chat-header">
                <span id="chat-with">Chọn một người để bắt đầu chat</span>
            </div>
            <div id="messages"></div>
            <div class="input-area">
                <input type="text" id="msg-input" placeholder="Nhập tin nhắn tư vấn xe...">
                <button onclick="sendMessage()">GỬI</button>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="client.js"></script>
</body>
</html>
